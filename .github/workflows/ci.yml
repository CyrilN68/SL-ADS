name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: pytest (Python 3.12 / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest tests/ --tb=short

  smoke-launcher:
    name: Smoke - run_pipeline.py --list-steps and --dry-run
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List steps for all datasets
        run: |
          for ds in RedeRio METR-LA GECCO-IoT CESNET-TimeSeries24; do
            python run_pipeline.py --dataset "$ds" --list-steps
          done

      - name: Full dry-run
        run: python run_pipeline.py --dry-run

  artifact-prerequisites:
    name: Artifact prerequisites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required documentation and metadata
        run: |
          test -f LICENSE
          test -f CITATION.cff
          test -f README.md
          test -f docs/README.md
          test -f docs/ARTIFACT_APPENDIX.md
          test -f docs/honest_limitations.md
          test "$(wc -l < README.md)" -ge 50
