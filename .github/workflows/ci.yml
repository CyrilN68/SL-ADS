name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show environment
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest (default mode — DeprecationWarning ignored)
        run: pytest tests/ -v --tb=short

      - name: Run pytest (strict mode — DeprecationWarning is an error)
        run: pytest tests/ -W error::DeprecationWarning

      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=src/sl_ads --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  smoke-launcher:
    name: Smoke — run_pipeline.py --list-steps & --dry-run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: --list-steps for all 4 datasets
        run: |
          for ds in RedeRio METR-LA GECCO-IoT CESNET-TimeSeries24; do
            python run_pipeline.py --dataset "$ds" --list-steps
          done

      - name: Full --dry-run (RedeRio default)
        run: python run_pipeline.py --dry-run

  artifact-evaluation:
    name: Artifact-evaluation prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE present
        run: test -f LICENSE
      - name: CITATION.cff present
        run: test -f CITATION.cff
      - name: README.md present and ≥ 50 lines
        run: |
          test -f README.md
          test "$(wc -l < README.md)" -ge 50
      - name: Artifact appendix present
        run: test -f docs/ARTIFACT_APPENDIX.md
      - name: Phase H renaming log present
        run: test -f docs/RENAMING_LOG_PHASE_H.md
      - name: Honest limitations doc present
        run: test -f docs/honest_limitations.md
